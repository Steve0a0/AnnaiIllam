name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - production-hardening
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Mobile test and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-ui-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: apps/mobile-ui-lab/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run TypeScript check
        run: npx tsc --noEmit
